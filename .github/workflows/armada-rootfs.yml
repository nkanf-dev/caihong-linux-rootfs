name: Build experimental Caihong Armada rootfs

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Armada release tag to create or update
        required: true
        default: armada-latest
      publish_release:
        description: Publish matching Armada boot, kernel, and rootfs assets
        required: true
        type: boolean
        default: false

permissions:
  contents: write
  packages: read

concurrency:
  group: caihong-armada-rootfs-${{ github.ref }}
  cancel-in-progress: false

jobs:
  armada-rootfs:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 360
    env:
      CCACHE_BASEDIR: ${{ github.workspace }}
      CCACHE_COMPILERCHECK: content
      CCACHE_DIR: ${{ github.workspace }}/.ccache
    steps:
      - uses: actions/checkout@v4

      - name: Install host dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            alsa-utils android-sdk-libsparse-utils bc bison build-essential \
            ccache curl dwarves e2fsprogs flex git kmod libarchive-tools \
            libelf-dev libssl-dev m4 meson ninja-build python3 rsync \
            shellcheck skopeo umoci zstd

      - name: Resolve component branches
        run: scripts/checkout-dependencies.sh

      - name: Restore compiler cache
        uses: actions/cache/restore@v4
        with:
          path: .ccache
          key: ccache-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('dependencies.env', 'linux/arch/arm64/configs/caihong_defconfig') }}-${{ github.run_id }}
          restore-keys: |
            ccache-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('dependencies.env', 'linux/arch/arm64/configs/caihong_defconfig') }}-
            ccache-${{ runner.os }}-${{ runner.arch }}-

      - name: Configure compiler cache
        run: |
          ccache --max-size=2G
          ccache --set-config=compression=true
          ccache --set-config=compression_level=6
          ccache --zero-stats

      - name: Build matching kernel and boot images
        run: |
          jobs=$(nproc)
          JOBS=$jobs ZSTD_THREADS=$jobs FORCE=1 \
            KERNEL_CC="ccache gcc" KERNEL_HOSTCC="ccache gcc" \
            scripts/build-kernel-release.sh

      - name: Show compiler cache statistics
        if: always()
        run: ccache --show-stats

      - name: Save compiler cache
        if: success()
        uses: actions/cache/save@v4
        with:
          path: .ccache
          key: ccache-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('dependencies.env', 'linux/arch/arm64/configs/caihong_defconfig') }}-${{ github.run_id }}

      - name: Free kernel build space
        run: rm -rf .ccache linux build/linux

      - name: Build Armada rootfs
        run: |
          kernel_release=$(cat release/KERNEL_RELEASE)
          sudo -E env \
            ARMADA_IMAGE=ghcr.io/armada-os/armada:stable \
            MODULE_TREE="$PWD/modules-current" \
            RELEASE_DIR="$PWD/release" \
            SPARSE_IMAGE=1 \
            scripts/package-armada-rootfs.sh \
            "release/caihong-armada-rootfs-$kernel_release.ext4.sparse.img"
          sudo chown -R "$USER:$USER" release

      - name: Prepare distinct Armada artifacts
        run: |
          kernel_release=$(cat release/KERNEL_RELEASE)
          scripts/prepare-release-assets.py \
            --release-dir release \
            --rootfs "release/caihong-armada-rootfs-$kernel_release.ext4.sparse.img" \
            --dependencies build/dependencies.resolved.env \
            --assets release/armada-assets \
            --notes release/ARMADA_NOTES.md
          cp release/release-manifest.json \
            release/armada-assets/caihong-armada-release-manifest.json
          cp release/ARMADA_NOTES.md release/armada-assets/
          cp release/SHA256SUMS release/armada-assets/SHA256SUMS.armada-full
          (
            cd release/armada-assets
            sha256sum caihong-armada-rootfs-* > SHA256SUMS.armada
          )

      - name: Publish matching Armada assets to GitHub release
        if: inputs.publish_release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail
          case "$RELEASE_TAG" in
            armada-?*) ;;
            *) echo "Use an Armada-specific release tag (armada-*)." >&2; exit 1 ;;
          esac

          publish=()
          for path in release/armada-assets/*; do
            [[ -f $path ]] || continue
            publish+=("$path")
          done
          if [[ ${#publish[@]} -le 3 ]]; then
            echo "Incomplete Armada release assets." >&2
            exit 1
          fi

          if ! gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" \
              --target "$GITHUB_SHA" \
              --title "Experimental Caihong Armada rootfs ($RELEASE_TAG)" \
              --notes-file release/ARMADA_NOTES.md \
              --prerelease
          fi
          gh release upload "$RELEASE_TAG" "${publish[@]}" --clobber

      - name: Upload Armada boot artifacts
        uses: actions/upload-artifact@v4
        with:
          name: caihong-armada-boot-${{ github.run_id }}
          path: |
            release/armada-assets/caihong-boot-linux-*.img
            release/armada-assets/caihong-boot-userdata-*.img
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

      - name: Upload Armada kernel package
        uses: actions/upload-artifact@v4
        with:
          name: caihong-armada-kernel-package-${{ github.run_id }}
          path: release/armada-assets/linux-caihong-*-aarch64.pkg.tar.zst
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

      - name: Upload Armada rootfs build
        uses: actions/upload-artifact@v4
        with:
          name: caihong-armada-rootfs-${{ github.run_id }}
          path: release/armada-assets/caihong-armada-rootfs-*
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

      - name: Upload Armada metadata
        uses: actions/upload-artifact@v4
        with:
          name: caihong-armada-metadata-${{ github.run_id }}
          path: |
            release/armada-assets/caihong-armada-release-manifest.json
            release/armada-assets/ARMADA_NOTES.md
            release/armada-assets/SHA256SUMS.armada
            release/armada-assets/SHA256SUMS.armada-full
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
