# Partial override merged into an existing DeckyClash 1.3.5 override.yaml.
# Keep the existing DNS servers, fake-IP filters, and local route exclusions.
dns-override:
  ipv6: false
tun-override:
  enable: true
  device: ArmadaClash
  stack: mixed
  auto-route: true
  auto-redirect: false
  strict-route: true
  auto-detect-interface: true
  dns-hijack:
    - any:53
    - tcp://any:53
always-override:
  mode: global
  ipv6: false
  allow-lan: false
  port: 0
  socks-port: 0
  redir-port: 0
  tproxy-port: 0
  profile:
    store-selected: true
    store-fake-ip: true
